<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Crear cuenta | Silvia Crea</title><link rel="icon" href="assets/logo%20web.png"><link rel="stylesheet" href="css/estilos.css"><link rel="stylesheet" href="css/cuenta.css"></head><body><header class="site-header"><div class="header-inner"><a class="brand" href="index.html"><img src="assets/logo%20web.png" class="header-logo" alt=""><span><strong>Silvia Crea ♡</strong><small>Arte y manualidades</small></span></a><nav class="main-nav"><a href="index.html">Inicio</a><a href="tienda.html">Tienda</a><a href="carrito.html">Carrito</a><a href="cuenta.html">Mi cuenta</a></nav></div></header><main class="account-wrap"><section class="account-card"><p class="eyebrow">Silvia Crea · Tu espacio</p><h1>Crear mi cuenta</h1><p class="account-note">Regístrate para consultar tus solicitudes y tener tus datos a mano.</p><form class="account-form" data-account-form data-endpoint="/register"><label>Nombre de usuario<input name="username" required minlength="3" maxlength="30"></label><label>Nombre y apellidos<input name="fullName" required></label><label>Email<input name="email" type="email" required></label><label>Teléfono<input name="phone" type="tel" required autocomplete="tel"></label><label>Dirección<input name="address" required autocomplete="street-address"></label><label>Código postal<input name="postalCode" required autocomplete="postal-code"></label><label>Localidad<input name="city" required autocomplete="address-level2"></label><label>Provincia<input name="province" autocomplete="address-level1"></label><label>País<input name="country" value="España" required autocomplete="country-name"></label><label>Contraseña (mínimo 12 caracteres)<input name="password" type="password" minlength="12" required autocomplete="new-password"></label><label>Confirmar contraseña<input name="passwordConfirm" type="password" minlength="12" required autocomplete="new-password"></label><button>Crear cuenta</button><p class="account-result" data-result hidden></p></form><p><a href="login.html">Ya tengo cuenta</a></p></section></main><footer class="site-footer"><p>Silvia Crea ♡ · Arte y manualidades hechas con cariño.</p><a href="contacto.html">Contacto</a></footer><script src="js/cuenta.js?v=78" defer></script></body></html>
