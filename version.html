<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="silvia-build" content="46.0">
  <title>Versión de Silvia Crea</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;
    padding:24px;background:#f7f2f8;color:#403447;font:16px/1.5 system-ui,sans-serif}
    main{width:min(100%,520px);padding:32px;border:1px solid #e5d9e9;border-radius:18px;
    background:#fff;box-shadow:0 12px 36px #46324b12;text-align:center}
    h1{font-size:1.35rem;margin:0 0 8px} .version{font-size:3rem;font-weight:750;color:#765b89;line-height:1.2;margin:18px 0}
    p{margin:8px 0;color:#685d6d}.status{margin-top:20px;padding:12px;border-radius:10px;background:#f3edf5}
    button{margin-top:18px;border:0;border-radius:999px;padding:11px 18px;background:#765b89;color:white;font-weight:650;cursor:pointer}
    small{display:block;margin-top:18px;color:#877d8a}
  </style>
</head>
<body>
  <main>
    <h1>Silvia Crea</h1>
    <p>Versión publicada de la web</p>
    <div class="version" id="version">Comprobando…</div>
    <div class="status" id="status" role="status">Consultando la versión que sirve el servidor…</div>
    <div class="status" id="data-updated" role="status">Consultando la última actualización de datos.json en GitHub…</div>
    <button type="button" onclick="checkVersion()">Volver a comprobar</button>
    <small id="checked"></small>
  </main>
  <script>
    const GITHUB_REPO = "silviiacrea/Silvia-Crea";
    const GITHUB_DATA_RAW = "https://raw.githubusercontent.com/silviiacrea/Silvia-Crea/main/datos.json";
    const GITHUB_COMMITS = "https://api.github.com/repos/" + GITHUB_REPO + "/commits?path=datos.json&per_page=1&sha=main";

    async function checkVersion(){
      const status=document.getElementById('status');
      const version=document.getElementById('version');
      const dataUpdated=document.getElementById('data-updated');
      const checked=document.getElementById('checked');
      status.textContent='Consultando la versión que sirve el servidor…';
      dataUpdated.textContent='Consultando la última actualización de datos.json en GitHub…';

      const tasks = await Promise.allSettled([
        (async()=>{
          const response=await fetch('index.html?version_check='+Date.now(),{cache:'no-store'});
          if(!response.ok) throw new Error('HTTP '+response.status);
          const html=await response.text();
          const doc=new DOMParser().parseFromString(html,'text/html');
          const live=doc.querySelector('meta[name="silvia-build"]')?.content;
          if(!live) throw new Error('No se encontró la marca de versión en index.html');
          return live;
        })(),
        (async()=>{
          // Leer el JSON publicado en GitHub evita mostrar la fecha de una copia local.
          const raw=await fetch(GITHUB_DATA_RAW+'?v='+Date.now(),{cache:'no-store'});
          if(!raw.ok) throw new Error('No se pudo leer datos.json ('+raw.status+')');
          const json=await raw.json();
          if(!json || typeof json!=='object') throw new Error('datos.json no contiene un objeto válido');
          let date=null, source='GitHub';
          try{
            const commits=await fetch(GITHUB_COMMITS,{cache:'no-store',headers:{'Accept':'application/vnd.github+json'}});
            if(commits.ok){
              const rows=await commits.json();
              date=rows?.[0]?.commit?.committer?.date||rows?.[0]?.commit?.author?.date||null;
            }
          }catch(_){}
          if(!date){
            const modified=raw.headers.get('Last-Modified');
            if(modified)date=modified;
          }
          if(!date)throw new Error('GitHub no ha facilitado la fecha de modificación del archivo');
          return {date,source};
        })()
      ]);

      if(tasks[0].status==='fulfilled'){
        version.textContent='v'+tasks[0].value;
        status.textContent='Versión leída directamente de index.html publicado.';
      }else{
        version.textContent='No disponible';
        status.textContent='No se pudo leer la versión publicada: '+tasks[0].reason.message;
      }

      if(tasks[1].status==='fulfilled'){
        const when=new Date(tasks[1].value.date);
        if(Number.isNaN(when.getTime()))throw new Error('Fecha de GitHub no válida');
        const formatted=new Intl.DateTimeFormat('es-ES',{
          weekday:'long',year:'numeric',month:'long',day:'numeric',
          hour:'2-digit',minute:'2-digit',timeZone:'Europe/Madrid'
        }).format(when);
        dataUpdated.textContent='Última actualización de datos.json en GitHub: '+formatted+' (hora peninsular española).';
      }else{
        dataUpdated.textContent='No se pudo consultar la fecha de datos.json en GitHub: '+tasks[1].reason.message;
      }
      checked.textContent='Última comprobación: '+new Date().toLocaleString('es-ES');
    }
    checkVersion();
  </script>
</body>
</html>
